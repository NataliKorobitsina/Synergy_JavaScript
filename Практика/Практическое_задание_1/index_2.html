<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание_2</title>
</head>
<body>
    <script>
        let employeeList = document.createElement('ol');
        let employees = [
            {firstName: 'Иван', lastName: 'Иванов' },
            {firstName: 'Пётр', lastName: 'Петров' },
            {firstName: 'Анна', lastName: 'Сидорова' },
            {firstName: 'Роза', lastName: 'Люксембург' },
            {firstName: 'Лиза', lastName: 'Чайкина' },
        ];
   
        for (let employee of employees) {
            let li = document.createElement('li');
            li.textContent = employee.firstName + ' ' + employee.lastName;
            employeeList.append(li);
        }
        document.body.append(employeeList);
    </script>
   
</body>
</html>
