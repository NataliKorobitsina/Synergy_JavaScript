<body id = "main">
	<script>
		function loadNewSript(src, callback) {
		let script = document.createElement('script');
		script.src = src;

		script.onload = () => callback(null, script);
		script.onerror = () => callback(new Error(`Script download error! ${src}`));

		document.head.append(script);
		}
		loadNewSript('myHomeWorkScript.js', function(error, script) {
		if (error) {
			alert(error);
		} else {
			createDiv();
		}
	});
	</script>
</body>
